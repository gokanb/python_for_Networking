    <text x="535" y="144" text-anchor="middle" fill="#8b949e" font-size="12">arp / bootp / icmp</text>
  </g>
  <g>
    <rect x="645" y="70" width="190" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="740" y="100" text-anchor="middle" fill="#79c0ff" font-size="15" font-weight="700">system_utils</text>
