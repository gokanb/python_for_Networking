<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="230" rx="14" fill="#0d1117"/>
  <text x="430" y="38" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">python-network-toolkit — what's inside</text>

  <g>
    <rect x="30" y="70" width="190" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="125" y="100" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="700">subnet_calculator</text>
    <text x="125" y="126" text-anchor="middle" fill="#8b949e" font-size="12">network / broadcast</text>
    <text x="125" y="144" text-anchor="middle" fill="#8b949e" font-size="12">hosts, wildcard, /CIDR</text>
    <text x="125" y="168" text-anchor="middle" fill="#3fb950" font-size="12">★ headline project</text>
  </g>
  <g>
    <rect x="235" y="70" width="190" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="330" y="100" text-anchor="middle" fill="#d29922" font-size="15" font-weight="700">socket_examples</text>
    <text x="330" y="126" text-anchor="middle" fill="#8b949e" font-size="12">TCP client, HTTP server</text>
    <text x="330" y="144" text-anchor="middle" fill="#8b949e" font-size="12">port checker</text>
  </g>
  <g>
    <rect x="440" y="70" width="190" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="535" y="100" text-anchor="middle" fill="#bc8cff" font-size="15" font-weight="700">packet_sniffer</text>
